services:
  mysql:
    image: mysql:8.4.7
    ports: ["127.0.0.1:3307:3306"]
    environment:
      MYSQL_DATABASE: maochumo_demo
      MYSQL_USER: maochumo
      MYSQL_PASSWORD: ${DB_PASSWORD:?Run npm run setup first}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run npm run setup first}
    volumes: ["mysql_data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost --silent"]
      interval: 3s
      timeout: 3s
      retries: 30
volumes:
  mysql_data:
